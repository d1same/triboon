name: apple client

on:
  push:
    branches: [main]
    paths:
      - 'clients/apple/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'clients/apple/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Archive, cloud-sign, and upload to TestFlight (requires Apple Developer secrets)'
        type: boolean
        default: false
      platform:
        description: 'Which Apple target(s) to upload to TestFlight'
        type: choice
        default: both
        options:
          - both
          - ios
          - tvos

permissions:
  contents: read

jobs:
  apple-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run TriboonCore Swift unit tests
        working-directory: clients/apple/Packages/TriboonCore
        run: swift test

      - name: Install XcodeGen and generate project
        working-directory: clients/apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build TriboonIOS (iPhone & iPad Simulator)
        working-directory: clients/apple
        run: |
          xcodebuild \
            -project TriboonApple.xcodeproj \
            -scheme TriboonIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=NO \
            build
          plutil -p build/ios-sim/Build/Products/Debug-iphonesimulator/Triboon.app/Info.plist | grep -q "UILaunchScreen"
          plutil -p build/ios-sim/Build/Products/Debug-iphonesimulator/Triboon.app/Info.plist | grep -q "NSAllowsArbitraryLoads"
          plutil -p build/ios-sim/Build/Products/Debug-iphonesimulator/Triboon.app/Info.plist | grep -q "ITSAppUsesNonExemptEncryption"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-sim/Build/Products/Debug-iphonesimulator/Triboon.app \
            build/TriboonIOS-Simulator.app.zip

      - name: Build TriboonIOS (iPhone & iPad Device ARM64 unsigned)
        working-directory: clients/apple
        run: |
          xcodebuild \
            -project TriboonApple.xcodeproj \
            -scheme TriboonIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-dev \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build TriboonTV (Apple TV Simulator)
        working-directory: clients/apple
        run: |
          xcodebuild \
            -project TriboonApple.xcodeproj \
            -scheme TriboonTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build/tvos-sim \
            CODE_SIGNING_ALLOWED=NO \
            build
          plutil -p build/tvos-sim/Build/Products/Debug-appletvsimulator/Triboon.app/Info.plist | grep -q "ITSAppUsesNonExemptEncryption"

      - name: Build TriboonTV (Apple TV Device ARM64 unsigned)
        working-directory: clients/apple
        run: |
          xcodebuild \
            -project TriboonApple.xcodeproj \
            -scheme TriboonTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/tvos-dev \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload iOS Simulator build for TestingBot / Xcode testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: TriboonIOS-Simulator
          path: clients/apple/build/TriboonIOS-Simulator.app.zip
          retention-days: 14

  testflight-upload:
    name: Archive and upload to TestFlight
    needs: [apple-build]
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate Apple Developer & App Store Connect secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_B64; do
            if [ -z "${!v}" ]; then
              echo "Missing required GitHub secret: $v (see clients/apple/TESTFLIGHT_SETUP.md)"
              exit 1
            fi
          done
          printf '%s' "$ASC_API_KEY_P8_B64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          test -s "${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8" || { echo "Decoded .p8 key is empty"; exit 1; }

      - name: Install XcodeGen and generate project
        working-directory: clients/apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect ExportOptions.plist
        working-directory: clients/apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive and upload TriboonIOS (iPhone & iPad) to TestFlight
        if: inputs.platform == 'both' || inputs.platform == 'ios'
        working-directory: clients/apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild archive \
            -project TriboonApple.xcodeproj \
            -scheme TriboonIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TriboonIOS.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          xcodebuild -exportArchive \
            -archivePath build/TriboonIOS.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export-ios \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Archive and upload TriboonTV (Apple TV) to TestFlight
        if: inputs.platform == 'both' || inputs.platform == 'tvos'
        working-directory: clients/apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild archive \
            -project TriboonApple.xcodeproj \
            -scheme TriboonTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath build/TriboonTV.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          xcodebuild -exportArchive \
            -archivePath build/TriboonTV.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export-tvos \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
