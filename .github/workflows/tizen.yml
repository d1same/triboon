name: samsung tizen wgt

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'clients/tizen/**'
      - '.github/workflows/tizen.yml'
      - 'test/tizen-client.test.js'

permissions:
  contents: read

concurrency:
  group: tizen-wgt-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-tizen-wgt:
    name: Validate and package Samsung Tizen WGT
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '24'
      - name: Run Samsung Tizen contract tests
        run: node --test test/tizen-client.test.js
      - name: Package Samsung Tizen WGT archive
        run: |
          ver=$(node -p "require('./package.json').version")
          mkdir -p dist/tizen
          wgt="dist/tizen/Triboon-Samsung-Tizen-v${ver}.wgt"
          (cd clients/tizen && zip -r "../../${wgt}" config.xml index.html server-url.js connect.js icon-512.png splash-1920x1080.png)
          test -s "$wgt" || { echo "Expected Samsung Tizen WGT at $wgt"; exit 1; }
          unzip -l "$wgt" | grep -q "config.xml"
          unzip -l "$wgt" | grep -q "index.html"
          unzip -l "$wgt" | grep -q "icon-512.png"
          sha256sum "$wgt" > "${wgt}.sha256"
          ls -lh dist/tizen/
      - name: Upload Samsung Tizen WGT artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: Triboon-Samsung-Tizen-WGT
          path: |
            dist/tizen/*.wgt
            dist/tizen/*.wgt.sha256
          retention-days: 30
          if-no-files-found: error
