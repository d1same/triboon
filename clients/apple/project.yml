name: TriboonApple
options:
  bundleIdPrefix: app.triboon
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  TriboonCore:
    path: Packages/TriboonCore

settings:
  base:
    MARKETING_VERSION: "3.5.13"
    CURRENT_PROJECT_VERSION: 458
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  TriboonIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOS
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: Sources/iOS/Resources/bridge.js
      - path: Sources/iOS/Resources/Assets.xcassets
    info:
      path: Sources/iOS/Resources/Info.plist
    dependencies:
      - package: TriboonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.triboon.ios
        PRODUCT_NAME: Triboon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        INFOPLIST_KEY_CFBundleDisplayName: Triboon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TriboonTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/tvOS
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: Sources/tvOS/Resources/Assets.xcassets
    info:
      path: Sources/tvOS/Resources/Info.plist
    dependencies:
      - package: TriboonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.triboon.appletv
        PRODUCT_NAME: Triboon
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_CFBundleDisplayName: Triboon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

schemes:
  TriboonIOS:
    build:
      targets:
        TriboonIOS: all
  TriboonTV:
    build:
      targets:
        TriboonTV: all
