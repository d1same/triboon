<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Triboon Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body data-state="loading">
  <svg class="symbols" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M21 12A9 9 0 0 0 6 5.3L3 8"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></symbol>
    <symbol id="i-cc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></symbol>
    <symbol id="i-quality" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12H6"/><path d="M10 15V9"/><path d="M14 14.5a.5.5 0 0 0 .5.5h1a2.5 2.5 0 0 0 2.5-2.5v-1A2.5 2.5 0 0 0 15.5 9h-1a.5.5 0 0 0-.5.5z"/><path d="M6 15V9"/><rect x="2" y="5" width="20" height="14" rx="2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/></symbol>
    <symbol id="i-guide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/><path d="m16 12 5 3-5 3v-6Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9L12 3z"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></symbol>
    <symbol id="i-gpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 18v2M16 18v2M9 10h6M9 14h3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></symbol>
  </svg>

  <div id="art" class="art" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <header id="topbar" class="topbar" data-tauri-drag-region>
    <div class="identity" data-tauri-drag-region>
      <div class="eyebrow"><span id="liveBadge" class="live-badge">LIVE</span><span id="episode"></span></div>
      <h1 id="title">Triboon</h1>
      <p id="source"></p>
      <div id="liveEpg" class="live-epg" aria-label="Live TV schedule"></div>
    </div>
    <div class="top-actions">
      <div id="gpuBadge" class="gpu-badge checking" title="Hardware decoding has not been measured yet">
        <svg><use href="#i-gpu"/></svg><span>GPU checking</span>
      </div>
      <button id="minimize" class="window-button" aria-label="Minimize player" title="Minimize"><svg><use href="#i-min"/></svg></button>
      <button id="windowClose" class="window-button close" aria-label="Close player" title="Close"><svg><use href="#i-close"/></svg></button>
    </div>
  </header>

  <main id="surface" class="surface" tabindex="-1" aria-label="Video player">
    <div id="loading" class="loading" role="status" aria-live="polite">
      <div class="cover" id="loadCover" aria-hidden="true"></div>
      <div class="lc">
        <img class="loadLogo" src="triboon.png" alt="Triboon">
        <strong id="loadingTitle">Opening video</strong>
        <div class="loadSteps" aria-hidden="true"><span class="loadStep"></span></div>
        <span id="loadingStage">Preparing</span>
      </div>
    </div>

    <button id="centerPlay" class="center-play" aria-label="Play" title="Play or pause">
      <svg class="filled"><use id="centerPlayIcon" href="#i-play"/></svg>
    </button>
    <button type="button" id="pipExpand" class="pip-expand" aria-label="Full screen">Full screen</button>

    <section id="errorCard" class="error-card" role="alert">
      <strong>Playback stopped</strong>
      <span id="errorText">The video could not be played.</span>
      <div><button id="retry" class="pill primary">Try again</button><button id="errorClose" class="pill">Close</button></div>
    </section>

    <div id="upNext" class="up-next">
      <button id="upNextPlay" class="up-next-play" aria-label="Next episode" title="Next episode">
        Next Episode
        <b id="upNextSeconds" class="up-next-sr"></b>
      </button>
      <button id="upNextDismiss" class="up-next-dismiss" aria-label="Dismiss next episode" title="Dismiss next episode">
        <svg><use href="#i-close"/></svg>
      </button>
    </div>
  </main>

  <aside id="menu" class="menu" aria-hidden="true" aria-labelledby="menuTitle">
    <div class="menu-head"><div><span id="menuKicker">PLAYER</span><h2 id="menuTitle">Options</h2></div><button id="menuClose" class="icon-button" aria-label="Close menu"><svg><use href="#i-close"/></svg></button></div>
    <div id="menuList" class="menu-list" role="menu"></div>
  </aside>

  <aside id="stats" class="stats" aria-hidden="true" aria-labelledby="statsTitle">
    <div class="menu-head"><div><span>PLAYBACK</span><h2 id="statsTitle">Technical details</h2></div><button id="statsClose" class="icon-button" aria-label="Close technical details"><svg><use href="#i-close"/></svg></button></div>
    <dl id="statsList"></dl>
    <p class="stats-note">Hardware decoding is shown only after libmpv reports the active decoder.</p>
  </aside>

  <footer id="controls" class="controls" aria-label="Playback controls">
    <div class="seekLine">
      <span class="seekTime" id="currentTime">0:00</span>
      <div class="timeline-wrap">
        <div id="bufferBar" class="buffer-bar" aria-hidden="true"></div>
        <input id="timeline" class="timeline" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      </div>
      <span class="seekTime" id="duration">0:00</span>
    </div>
    <div class="control-row">
      <div class="control-group ctlLeft">
        <button id="guide" class="control optional" aria-label="TV guide" title="TV guide (G)"><svg><use href="#i-guide"/></svg></button>
        <button id="episodes" class="control optional" aria-label="Episodes" title="Episodes"><svg><use href="#i-list"/></svg></button>
        <button id="details" class="control" aria-label="Playback details" title="Playback details (I)"><svg><use href="#i-info"/></svg></button>
      </div>
      <div class="control-group transport">
        <button id="back" class="control" aria-label="Back 10 seconds" title="Back 10 seconds (J)"><svg><use href="#i-back"/></svg></button>
        <button id="playPause" class="control primary" aria-label="Play" title="Play or pause (Space)"><svg class="filled"><use id="playPauseIcon" href="#i-play"/></svg></button>
        <button id="forward" class="control" aria-label="Forward 30 seconds" title="Forward 30 seconds (L)"><svg><use href="#i-forward"/></svg></button>
        <button id="next" class="control optional" aria-label="Next episode" title="Next episode (N)"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="control-group secondary">
        <button id="favorite" class="control optional" aria-label="Add channel to favorites" title="Favorite channel"><svg><use href="#i-star"/></svg></button>
        <button id="captions" class="control" aria-label="Subtitles" title="Subtitles (C)"><svg><use href="#i-cc"/></svg></button>
        <button id="audio" class="control optional" aria-label="Audio track" title="Audio track"><svg><use href="#i-audio"/></svg></button>
        <button id="quality" class="control optional" aria-label="Video quality" title="Video quality"><svg><use href="#i-quality"/></svg></button>
        <div class="volume-wrap">
          <button id="mute" class="control" aria-label="Mute" title="Mute (M)"><svg><use href="#i-volume"/></svg></button>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
        </div>
        <button id="fullscreen" class="control" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg><use href="#i-fullscreen"/></svg></button>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="srStatus" class="sr-only" aria-live="polite"></div>
  <script src="player.js"></script>
</body>
</html>
