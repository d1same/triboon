<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Triboon for LG TV</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --surface: #14141c;
      --border: rgba(255, 255, 255, 0.14);
      --text: #f5f5f7;
      --muted: #9da0ae;
      --accent: #e11d74;
      --accent-hover: #f43f8e;
      --ok: #3ddc84;
      --err: #fb7185;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
      background: radial-gradient(circle at 20% 20%, rgba(225, 29, 116, 0.14), transparent 55%), var(--bg);
    }
    .card {
      width: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 56px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .brand img {
      width: 68px;
      height: 68px;
      border-radius: 14px;
    }
    .brand h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 34px;
      font-size: 24px;
      line-height: 1.45;
      color: var(--muted);
    }
    label {
      display: block;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      height: 70px;
      padding: 0 22px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #0d0d13;
      color: var(--text);
      font-size: 26px;
      outline: none;
    }
    input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25);
    }
    .actions {
      display: flex;
      gap: 18px;
      margin-top: 28px;
    }
    button {
      height: 68px;
      padding: 0 36px;
      border-radius: 12px;
      border: 2px solid transparent;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .primary {
      background: var(--accent);
      color: #ffffff;
      flex: 1;
    }
    .primary:hover, .primary:focus {
      background: var(--accent-hover);
      border-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25);
    }
    .secondary {
      background: #1f1f2b;
      color: var(--text);
      border-color: var(--border);
    }
    .secondary:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25);
    }
    .status {
      min-height: 36px;
      margin-top: 24px;
      font-size: 22px;
      line-height: 1.4;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .saved {
      margin-top: 14px;
      font-size: 19px;
      color: var(--muted);
    }
    .hint {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 19px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Connect to Triboon Server">
      <div class="brand">
        <img src="icon-130.png" alt="Triboon">
        <h1>Triboon</h1>
      </div>
      <p class="subtitle">Connect to your self-hosted Triboon media server.</p>
      <form id="connectForm" novalidate>
        <label for="serverInput">Server address</label>
        <input id="serverInput" type="url" inputmode="url" autocomplete="off" spellcheck="false"
               placeholder="http://192.168.1.50:7777 or https://tv.example.com">
        <div class="actions">
          <button id="connectBtn" class="primary" type="submit">Connect</button>
          <button id="retryBtn" class="secondary" type="button" hidden>Retry</button>
        </div>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="savedRow" class="saved" hidden>Saved server: <strong id="savedUrl"></strong></div>
      <p class="hint">Press Back on your LG remote to exit. Triboon connects only to your own server.</p>
    </section>
  </main>
  <script src="server-url.js"></script>
  <script src="connect.js"></script>
</body>
</html>
